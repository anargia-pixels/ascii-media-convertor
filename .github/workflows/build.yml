# Lint, build standalone binaries for each platform, and publish them on tags.
name: Build

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv run --locked ruff check
      - run: uv run --locked ruff format --check

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, target: linux-x86_64 }
          - { os: ubuntu-24.04-arm, target: linux-arm64 }
          - { os: macos-15-intel, target: macos-x86_64 }
          - { os: macos-15, target: macos-arm64 }
          - { os: windows-2025, target: windows-x86_64 }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3

      - name: Build binary
        run: uv run --locked pyinstaller --noconfirm ascii-media.spec

      # Convert an image and a short video with the bundled ffmpeg.
      - name: Smoke test
        run: |
          ./dist/ascii-media --version
          ./dist/ascii-media docs/preview-input.png -r 20 -o smoke.png
          uv run --locked python -c "import imageio_ffmpeg, subprocess; subprocess.run([imageio_ffmpeg.get_ffmpeg_exe(), '-loglevel', 'error', '-f', 'lavfi', '-i', 'testsrc=duration=1:size=320x240:rate=10', 'clip.mp4'], check=True)"
          ./dist/ascii-media clip.mp4 -r 20 -o smoke.mp4

      - name: Rename binary
        run: |
          ext=""
          if [ "$RUNNER_OS" = Windows ]; then ext=".exe"; fi
          mkdir out
          mv "dist/ascii-media$ext" "out/ascii-media-${{ matrix.target }}$ext"

      - uses: actions/upload-artifact@v7
        with:
          name: ascii-media-${{ matrix.target }}
          path: out/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [lint, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: out
          merge-multiple: true

      - name: Write checksums
        run: cd out && sha256sum ascii-media-* > SHA256SUMS

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" out/* --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes
