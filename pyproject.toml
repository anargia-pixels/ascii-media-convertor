[project]
name = "ascii-media"
version = "1.1.0"
description = "Convert images and videos into ASCII art."
readme = "README.md"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "certifi>=2026.10.23",
    "imageio-ffmpeg>=0.8.1",
    "numpy>=2.4.6",
    "pillow>=13.0.0",
    "rich-click>=1.9.9",
]

[project.scripts]
ascii-media = "ascii_media.cli:run"

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyinstaller>=6.22.3",
    "ruff>=0.17.5",
]
